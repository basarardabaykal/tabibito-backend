services:
  backend:
    build:
      # Sets the directory to look for Dockerfile
      context: .
      dockerfile: Dockerfile
    env_file:
      - backend.env
    container_name: tabibito-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/tabibito-backend
    restart: unless-stopped
  database:
    image: postgres:18-alpine
    env_file:
     - database.env
    container_name: tabibito-database
    ports:
     - "5432:5432"
    volumes:
     - ./pg_data:/var/lib/postgresql
    restart: unless-stopped
  frontend:
    build:
      context: ../tabibito-frontend
      dockerfile: Dockerfile
    container_name: tabibito-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../tabibito-frontend:/tabibito-frontend
      - /tabibito-frontend/node_modules # separate container path
    restart: unless-stopped

